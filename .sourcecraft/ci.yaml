on:
  push:
    - workflows: [fc27-tests]
      filter:
        branches: ["main"]

workflows:
  fc27-tests:
    tasks:
      - name: run-python-tests
        cubes:
          - name: install-and-test
            image: docker.io/library/python:3.11
            script:
              - python -m pip install --upgrade pip
              - pip install -r requirements.txt
              - python -m pytest -v
