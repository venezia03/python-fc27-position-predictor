on:
  push:
    - workflows: [fc27-tests]
      filter:
        branches: ["main"]

workflows:
  fc27-tests:
    tasks:
      - name: run-python-checks
        cubes:
          - name: install-lint-and-test
            image: docker.io/library/python:3.11
            script:
              - python -m pip install --upgrade pip
              - pip install -r requirements.txt
              - pip install ruff
              - ruff check --select E,F,I app tests train.py preprocessing.py eda.py
              - python -m pytest -v